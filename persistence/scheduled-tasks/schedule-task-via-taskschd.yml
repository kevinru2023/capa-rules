rule:
  meta:
    name: register Task in Task Scheduler via TaskService
    namespace: persistence/scheduled-tasks
    authors:
      - kevinru2005@gmail.com
    description: the sample calls the TaskService method to schedule Task
    scopes:
      static: function
      dynamic: span of calls
    att&ck:
      Persistence::Schedule Task/Job::Scheduled Task [T1053.005]
    references:
      - https://learn.microsoft.com/en-us/windows/win32/taskschd/taskservice
      - https://learn.microsoft.com/en-us/windows/win32/taskschd/taskfolder-registertaskdefinition
    examples: 
      - 1c444ebeba24dcba8628b7dfe5fec7c6.exe_
      - 
  features:
    - and: 
      - or:
        string: Schedule.Service  
        api: Taskschd.dll
        api: TaskService.Connect
        api: TaskFolder.RegisterTaskDefinition
      - or: 
        number: 0x2 = TASK_CREATE
        number: 0x4 = TASK_UPDATE
        number: 0x6 = TASK_CREATE_OR_UPDATE
        number: 0x20 = TASK_IGNORE_REGISTRATION_TRIGGERS
            